apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintechstation-backend
  labels:
    app: fintechstation-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fintechstation-backend
  template:
    metadata:
      labels:
        app: fintechstation-backend
    spec:
      containers:
      - name: backend
        image: fintechstation-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: fintechstation-secrets
              key: database-url
        - name: LONDON_STRATEGIC_EDGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: fintechstation-secrets
              key: london-edge-api-key
              optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fintechstation-backend-svc
spec:
  selector:
    app: fintechstation-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
